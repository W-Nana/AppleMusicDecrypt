<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleMusicDecrypt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --background-color: #121212;
            --surface-color: #1E1E1E;
            --primary-color: #1DB954;
            --text-color: #FFFFFF;
            --text-secondary-color: #B3B3B3;
            --border-color: #2c2c2c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            user-select: none; /* 禁止选择文本 */
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 1.5rem;
        }

        .tab-button {
            padding: 1rem 1.5rem;
            cursor: pointer;
            border: none;
            background-color: transparent;
            color: var(--text-secondary-color);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .tab-button.active {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h1, h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .file-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        
        #refreshBtn, #downloadSelectedBtn, #sortOrderBtn {
             padding: 0.5rem 1rem;
             font-size: 0.9rem;
        }
        
        #sortOrderBtn {
            min-width: 40px;
        }
        
        #sortBy, #searchInput {
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--surface-color);
            color: var(--text-color);
            font-size: 0.9rem;
        }

        #searchInput {
            flex-grow: 1;
            min-width: 200px;
        }

        .input-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        #urlInput {
            flex-grow: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--surface-color);
            color: var(--text-color);
            font-size: 1rem;
            user-select: auto; /* 允许在输入框中选择文本 */
        }

        #urlInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color);
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1ED760;
        }

        .stats-section {
            display: flex;
            justify-content: space-around;
            background-color: var(--surface-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: var(--text-secondary-color);
            font-size: 0.9rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        #tasks {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        #tasks th, #tasks td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        #tasks th {
            background-color: var(--surface-color);
            color: var(--primary-color);
            font-weight: 600;
        }
        
        #tasks tbody tr:hover {
            background-color: #2a2a2a;
        }

        #log {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            height: 300px;
            overflow-y: scroll;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            user-select: auto; /* 允许在日志框中选择文本 */
        }

        #file-explorer {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 1rem;
            min-height: 200px;
        }
        
        .file-tree ul {
            padding-left: 20px;
            list-style-type: none;
        }
        
        .file-tree .directory > ul {
            display: none;
        }

        .file-tree li {
            padding: 4px 0;
        }
        
        .file-tree .directory > .node-content > .node-name, .file-tree .file > .node-content > .node-name {
            cursor: pointer;
        }
        
        .file-tree .directory > .node-content > .node-name:hover, .file-tree .file > .node-content > .node-name:hover {
            color: var(--primary-color);
        }
        
        .file-tree .icon {
            margin-right: 8px;
        }
        
        .node-content {
            display: flex;
            align-items: center;
        }
        
        .node-content input[type="checkbox"] {
            margin-right: 8px;
        }

        .progress-container {
            margin-top: 1rem;
            display: none;
        }

        .progress-bar {
            width: 100%;
            background-color: var(--surface-color);
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 20px;
            width: 0%;
            background-color: var(--primary-color);
            transition: width 0.1s linear;
        }
        
        .progress-text {
            text-align: center;
            margin-top: 0.5rem;
            color: var(--text-secondary-color);
        }


        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .input-section {
                flex-direction: column;
            }
            .stats-section {
                flex-direction: column;
                gap: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>AppleMusicDecrypt</h1>

        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'downloader')">Downloader</button>
            <button class="tab-button" onclick="openTab(event, 'files')">Files</button>
        </div>

        <div id="downloader" class="tab-content active">
            <div class="input-section">
                <input id="urlInput" type="text" placeholder="Enter Apple Music URL"/>
                <button onclick="startDownload()">Download</button>
            </div>

            <div class="stats-section">
                <div class="stat">
                    <div class="stat-label">Download Speed</div>
                    <div id="downloadSpeed" class="stat-value">0 B/s</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Decrypt Speed</div>
                    <div id="decryptSpeed" class="stat-value">0 B/s</div>
                </div>
            </div>

            <h2>Tasks</h2>
            <table id="tasks">
                <thead>
                    <tr>
                        <th>Artist</th>
                        <th>Title</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>

            <h2>Log</h2>
            <pre id="log"></pre>
        </div>

        <div id="files" class="tab-content">
            <div class="section-header">
                <input id="searchInput" type="text" placeholder="Search files..."/>
                <div class="file-controls">
                    <select id="sortBy">
                        <option value="name">Sort by Name</option>
                        <option value="date">Sort by Date</option>
                    </select>
                    <button id="sortOrderBtn">↑</button>
                    <button id="refreshBtn" onclick="fetchFiles()">Refresh</button>
                    <button id="downloadSelectedBtn" onclick="downloadSelected()">Download Selected</button>
                </div>
            </div>
            <div id="file-explorer">
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const logElement = document.getElementById('log');
        const downloadSpeedElement = document.getElementById('downloadSpeed');
        const decryptSpeedElement = document.getElementById('decryptSpeed');
        const tasksTableBody = document.querySelector("#tasks tbody");
        const fileExplorer = document.getElementById('file-explorer');
        const searchInput = document.getElementById('searchInput');
        const sortBySelect = document.getElementById('sortBy');
        const sortOrderBtn = document.getElementById('sortOrderBtn');

        let currentSortBy = localStorage.getItem('sortBy') || 'date';
        let currentSortOrder = localStorage.getItem('sortOrder') || 'desc';

        // Set initial UI state
        sortBySelect.value = currentSortBy;
        sortOrderBtn.textContent = currentSortOrder === 'asc' ? '↑' : '↓';


        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'log') {
                const logLine = document.createElement('div');
                logLine.textContent = data.message;
                logElement.appendChild(logLine);
                logElement.scrollTop = logElement.scrollHeight;
            } else if (data.type === 'progress') {
                downloadSpeedElement.textContent = data.download_speed;
                decryptSpeedElement.textContent = data.decrypt_speed;

                // Update tasks table
                tasksTableBody.innerHTML = ''; // Clear table
                data.tasks.forEach(function(task) {
                    const row = tasksTableBody.insertRow();
                    const artistCell = row.insertCell(0);
                    const titleCell = row.insertCell(1);
                    const statusCell = row.insertCell(2);
                    artistCell.textContent = task.artist;
                    titleCell.textContent = task.name;
                    statusCell.textContent = task.status;
                });
            } else if (data.type === 'download_complete') {
                 fetchFiles();
            }
        };
        
        function startDownload() {
            const url = document.getElementById("urlInput").value;
            if(url) {
                ws.send(url);
                document.getElementById("urlInput").value = '';
            }
        }
        
        document.getElementById("urlInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                startDownload();
            }
        });

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const allNodes = fileExplorer.querySelectorAll('li');
            allNodes.forEach(node => {
                const nodeName = node.querySelector('.node-name').textContent.toLowerCase();
                if (nodeName.includes(searchTerm)) {
                    node.style.display = 'block';
                    // Make sure parents are visible
                    let parent = node.parentElement;
                    while (parent && parent.tagName !== 'DIV') {
                        if(parent.tagName === 'LI') {
                           parent.style.display = 'block';
                        }
                        parent = parent.parentElement;
                    }
                } else {
                    node.style.display = 'none';
                }
            });
        });
        
        sortBySelect.addEventListener('change', (e) => {
            currentSortBy = e.target.value;
            localStorage.setItem('sortBy', currentSortBy);
            fetchFiles();
        });

        sortOrderBtn.addEventListener('click', () => {
            currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
            sortOrderBtn.textContent = currentSortOrder === 'asc' ? '↑' : '↓';
            localStorage.setItem('sortOrder', currentSortOrder);
            fetchFiles();
        });

        function renderFileTree(nodes, parentPath = '') {
            const ul = document.createElement('ul');
            ul.className = 'file-tree';
            
            if (parentPath === '') {
                ul.style.display = 'block';
            }

            for (const node of nodes) {
                const li = document.createElement('li');
                li.className = node.type;
                li.dataset.name = node.name;
                const currentPath = parentPath ? `${parentPath}/${node.name}` : node.name;
                
                const nodeContent = document.createElement('div');
                nodeContent.className = 'node-content';
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.dataset.path = currentPath;
                checkbox.addEventListener('change', (e) => {
                    const isChecked = e.target.checked;
                    const childCheckboxes = li.querySelectorAll('input[type="checkbox"]');
                    childCheckboxes.forEach(child => child.checked = isChecked);
                });

                const nodeNameSpan = document.createElement('span');
                nodeNameSpan.className = 'node-name';
                
                if (node.type === 'directory') {
                    nodeNameSpan.innerHTML = `<span class="icon">📁</span> ${node.name}`;
                    nodeNameSpan.onclick = (e) => {
                        e.stopPropagation();
                        const childUl = li.querySelector('ul');
                        if (childUl) {
                            childUl.style.display = childUl.style.display === 'none' ? 'block' : 'none';
                        }
                    };
                    
                    nodeContent.appendChild(checkbox);
                    nodeContent.appendChild(nodeNameSpan);
                    li.appendChild(nodeContent);
                    if (node.children && node.children.length) {
                        const childrenUl = renderFileTree(node.children, currentPath)
                        li.appendChild(childrenUl);
                    }
                } else {
                    nodeNameSpan.innerHTML = `<span class="icon">📄</span> ${node.name}`;
                    nodeNameSpan.onclick = () => {
                        window.location.href = `/download/${currentPath}`;
                    };
                    nodeContent.appendChild(checkbox);
                    nodeContent.appendChild(nodeNameSpan);
                    li.appendChild(nodeContent);
                }
                ul.appendChild(li);
            }
            return ul;
        }

        async function fetchFiles() {
            try {
                const response = await fetch(`/files?sort_by=${currentSortBy}&sort_order=${currentSortOrder}`);
                const files = await response.json();
                fileExplorer.innerHTML = ''; // Clear previous tree
                if(files && !files.error && files.length > 0) {
                    fileExplorer.appendChild(renderFileTree(files));
                } else {
                    fileExplorer.innerHTML = '<p>No files downloaded yet.</p>';
                }
            } catch (error) {
                console.error('Error fetching file tree:', error);
                fileExplorer.innerHTML = '<p>Error loading files.</p>';
            }
        }
        
        async function downloadSelected() {
            const selectedFiles = [];
            const checkboxes = fileExplorer.querySelectorAll('input[type="checkbox"]:checked');
            
            if (checkboxes.length === 0) {
                alert("No files selected.");
                return;
            }

            let firstSelectedElement = checkboxes[0].closest('li');
            let zipName = '';

            if (firstSelectedElement.classList.contains('directory')) {
                zipName = firstSelectedElement.dataset.name;
            } else {
                zipName = firstSelectedElement.dataset.name.split('.').slice(0, -1).join('.');
            }


            checkboxes.forEach(checkbox => {
                const li = checkbox.closest('li');
                if (li.classList.contains('file')) {
                    selectedFiles.push(checkbox.dataset.path);
                }
            });
            
            if (selectedFiles.length > 0) {
                const formData = new FormData();
                formData.append('files', JSON.stringify(selectedFiles));
                formData.append('zip_name', zipName);
                
                const progressContainer = document.getElementById('progressContainer');
                const progressBarFill = document.getElementById('progressBarFill');
                const progressText = document.getElementById('progressText');

                progressContainer.style.display = 'block';
                progressBarFill.style.width = '0%';
                progressText.textContent = 'Starting download...';
                
                try {
                    const response = await fetch('/download-zip', {
                        method: 'POST',
                        body: formData
                    });

                    if (!response.ok) {
                        throw new Error(`Server error: ${response.statusText}`);
                    }
                    
                    const totalSize = Number(response.headers.get('Content-Length'));
                    let loaded = 0;
                    
                    const reader = response.body.getReader();
                    const chunks = [];
                    
                    while(true) {
                        const { done, value } = await reader.read();
                        if (done) {
                            break;
                        }
                        chunks.push(value);
                        loaded += value.length;
                        
                        const percentage = totalSize ? (loaded / totalSize) * 100 : 0;
                        progressBarFill.style.width = `${percentage}%`;
                        progressText.textContent = `Downloading... ${Math.round(percentage)}% (${(loaded / 1024 / 1024).toFixed(2)} MB / ${(totalSize / 1024 / 1024).toFixed(2)} MB)`;
                    }
                    
                    progressText.textContent = 'Download complete! Saving file...';

                    const blob = new Blob(chunks);
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = url;
                    a.download = `${zipName}.zip`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    
                    setTimeout(() => {
                         progressContainer.style.display = 'none';
                    }, 3000);

                } catch (error) {
                    console.error('Download failed:', error);
                    progressText.textContent = `Error: ${error.message}`;
                }

            } else {
                alert("No files selected to download.");
            }
        }
        
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tab-button");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }
        
        // Initial fetch
        fetchFiles();
    </script>
</body>
</html>
