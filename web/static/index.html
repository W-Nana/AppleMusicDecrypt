<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppleMusicDecrypt</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --background-color: #121212;
            --surface-color: #1E1E1E;
            --primary-color: #1DB954;
            --text-color: #FFFFFF;
            --text-secondary-color: #B3B3B3;
            --border-color: #2c2c2c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            user-select: none; /* 禁止选择文本 */
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        h1, h2 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #refreshBtn {
             padding: 0.5rem 1rem;
             font-size: 0.9rem;
        }

        .input-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        #urlInput {
            flex-grow: 1;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--surface-color);
            color: var(--text-color);
            font-size: 1rem;
            user-select: auto; /* 允许在输入框中选择文本 */
        }

        #urlInput:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 5px var(--primary-color);
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            background-color: var(--primary-color);
            color: var(--text-color);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #1ED760;
        }

        .stats-section {
            display: flex;
            justify-content: space-around;
            background-color: var(--surface-color);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: var(--text-secondary-color);
            font-size: 0.9rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        #tasks {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 2rem;
        }

        #tasks th, #tasks td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        #tasks th {
            background-color: var(--surface-color);
            color: var(--primary-color);
            font-weight: 600;
        }
        
        #tasks tbody tr:hover {
            background-color: #2a2a2a;
        }

        #log {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1rem;
            height: 300px;
            overflow-y: scroll;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-family: 'Courier New', Courier, monospace;
            user-select: auto; /* 允许在日志框中选择文本 */
        }

        #file-explorer {
            background-color: var(--surface-color);
            border-radius: 8px;
            padding: 1rem;
            min-height: 200px;
            margin-bottom: 2rem;
        }
        
        .file-tree ul {
            padding-left: 20px;
            list-style-type: none;
        }

        .file-tree li {
            padding: 4px 0;
        }

        .file-tree .directory > span, .file-tree .file > span {
            cursor: pointer;
        }
        
        .file-tree .directory > span:hover, .file-tree .file > span:hover {
            color: var(--primary-color);
        }
        
        .file-tree .icon {
            margin-right: 8px;
        }


        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }
            .input-section {
                flex-direction: column;
            }
            .stats-section {
                flex-direction: column;
                gap: 1rem;
            }
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>AppleMusicDecrypt</h1>
        <div class="input-section">
            <input id="urlInput" type="text" placeholder="Enter Apple Music URL"/>
            <button onclick="startDownload()">Download</button>
        </div>

        <div class="stats-section">
            <div class="stat">
                <div class="stat-label">Download Speed</div>
                <div id="downloadSpeed" class="stat-value">0 B/s</div>
            </div>
            <div class="stat">
                <div class="stat-label">Decrypt Speed</div>
                <div id="decryptSpeed" class="stat-value">0 B/s</div>
            </div>
        </div>

        <div class="section-header">
            <h2>File Explorer</h2>
            <button id="refreshBtn" onclick="fetchFiles()">Refresh</button>
        </div>
        <div id="file-explorer">
        </div>

        <h2>Tasks</h2>
        <table id="tasks">
            <thead>
                <tr>
                    <th>Artist</th>
                    <th>Title</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>

        <h2>Log</h2>
        <pre id="log"></pre>
    </div>

    <script>
        const ws = new WebSocket(`ws://${window.location.host}/ws`);
        const logElement = document.getElementById('log');
        const downloadSpeedElement = document.getElementById('downloadSpeed');
        const decryptSpeedElement = document.getElementById('decryptSpeed');
        const tasksTableBody = document.querySelector("#tasks tbody");
        const fileExplorer = document.getElementById('file-explorer');

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            if (data.type === 'log') {
                const logLine = document.createElement('div');
                logLine.textContent = data.message;
                logElement.appendChild(logLine);
                logElement.scrollTop = logElement.scrollHeight;
            } else if (data.type === 'progress') {
                downloadSpeedElement.textContent = data.download_speed;
                decryptSpeedElement.textContent = data.decrypt_speed;

                // Update tasks table
                tasksTableBody.innerHTML = ''; // Clear table
                data.tasks.forEach(function(task) {
                    const row = tasksTableBody.insertRow();
                    const artistCell = row.insertCell(0);
                    const titleCell = row.insertCell(1);
                    const statusCell = row.insertCell(2);
                    artistCell.textContent = task.artist;
                    titleCell.textContent = task.name;
                    statusCell.textContent = task.status;
                });
            } else if (data.type === 'download_complete') {
                 fetchFiles();
            }
        };
        
        function startDownload() {
            const url = document.getElementById("urlInput").value;
            if(url) {
                ws.send(url);
                document.getElementById("urlInput").value = '';
            }
        }
        
        document.getElementById("urlInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                startDownload();
            }
        });
        
        function renderFileTree(nodes, parentPath = '') {
            const ul = document.createElement('ul');
            ul.className = 'file-tree';

            for (const node of nodes) {
                const li = document.createElement('li');
                const span = document.createElement('span');
                const currentPath = parentPath ? `${parentPath}/${node.name}` : node.name;
                
                if (node.type === 'directory') {
                    li.className = 'directory';
                    span.innerHTML = `<span class="icon">📁</span> ${node.name}`;
                    span.onclick = (e) => {
                        e.stopPropagation();
                        const childUl = li.querySelector('ul');
                        if (childUl) {
                            childUl.style.display = childUl.style.display === 'none' ? 'block' : 'none';
                        }
                    };
                    li.appendChild(span);
                    if (node.children && node.children.length) {
                        li.appendChild(renderFileTree(node.children, currentPath));
                    }
                } else {
                    li.className = 'file';
                    span.innerHTML = `<span class="icon">📄</span> ${node.name}`;
                    span.onclick = () => {
                        window.location.href = `/download/${currentPath}`;
                    };
                    li.appendChild(span);
                }
                ul.appendChild(li);
            }
            return ul;
        }

        async function fetchFiles() {
            try {
                const response = await fetch('/files');
                const files = await response.json();
                fileExplorer.innerHTML = ''; // Clear previous tree
                if(files && !files.error && files.length > 0) {
                    fileExplorer.appendChild(renderFileTree(files));
                } else {
                    fileExplorer.innerHTML = '<p>No files downloaded yet.</p>';
                }
            } catch (error) {
                console.error('Error fetching file tree:', error);
                fileExplorer.innerHTML = '<p>Error loading files.</p>';
            }
        }
        
        // Initial fetch
        fetchFiles();
    </script>
</body>
</html>
